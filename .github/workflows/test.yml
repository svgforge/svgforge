name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_COLOR: 2
  NODE_COV: 24 # The Node.js version to run coveralls on

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [24, 25]
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Run example
        run: npm run example

      - name: Run tests
        run: npm test
        if: "!(startsWith(matrix.os, 'ubuntu') && matrix.node == env.NODE_COV)"

      - name: Run tests with coverage
        run: npm run test:coverage
        if: startsWith(matrix.os, 'ubuntu') && matrix.node == env.NODE_COV

      - name: Upload failed tests' screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: svg-sprite-ci-${{ matrix.node }}-${{ matrix.os }}-${{ github.sha }}
          path: tmp/

      - name: Run Coveralls
        uses: coverallsapp/github-action@v2
        if: startsWith(matrix.os, 'ubuntu') && matrix.node == env.NODE_COV
        with:
          path-to-lcov: coverage/lcov.info
          github-token: "${{ secrets.GITHUB_TOKEN }}"
