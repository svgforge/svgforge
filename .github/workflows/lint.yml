name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_COLOR: 2
  NODE: 24 # The Node.js version to run lint on

permissions:
  contents: read

jobs:
  run:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12
          runtime: node@${{ env.NODE }}
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm lint
