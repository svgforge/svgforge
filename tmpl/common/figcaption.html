<figcaption title="{{name}}{{#fileSize}}, {{fileSize}}{{/fileSize}}">
  <span class="name">{{name}}</span>
  <span class="meta">
    {{#fileSize}}
    <span class="file-size">{{fileSize}}</span>
    {{/fileSize}}
    <button type="button" class="copy" data-copy="{{name}}" data-copy-label="Copy ID">Copy ID</button>
  </span>
</figcaption>
